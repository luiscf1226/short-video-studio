# Estilo de la edición automática de los videos de Luis.
#
# Lo llena Marca. Se pueden cambiar los valores, no borrar claves: si falta
# una, la corrida se detiene y dice cuál. Colores en "#RRGGBB". Tiempos en
# segundos.

formato:
  ancho: 1080
  alto: 1920
  fps: 30
  duracion_ideal: [30, 45]   # fuera de este rango solo avisa
  duracion_maxima: 60        # si se pasa, se recorta en el último final de frase y avisa

gancho:
  # Los primeros segundos son la primera frase de Luis, con esa misma frase en
  # texto grande arriba.
  duracion: 2.0
  palabras_min: 5
  palabras_max: 8
  mayusculas: true
  tamano: 92
  color: "#FFFFFF"
  borde: "#000000"
  grosor_borde: 7
  margen_superior: 250       # px desde arriba; deja libre la barra de pestañas de TikTok
  # Si el video arranca con alguno de estos saludos, se recorta (además del
  # silencio inicial). Sin tildes ni mayúsculas.
  saludos_a_recortar:
    - hola a todos
    - hola que tal
    - hola amigos
    - hola chicos
    - hola gente
    - buenas buenas
    - que tal
    - hola
    - buenas
  # Solo orienta las sugerencias de texto; el gancho del video es la frase real.
  tono: directo, en segunda persona, sin clickbait

cortes:
  silencio_maximo: 0.35      # una pausa más larga que esto se acorta...
  pausa_que_queda: 0.2       # ...hasta dejar esta pausa natural
  umbral_silencio_db: -35    # nivel de audio que cuenta como silencio
  # Ruido que se corta siempre.
  muletillas_siempre:
    - eh
    - ehh
    - eeh
    - em
    - emm
    - ehm
    - mmm
    - mm
    - hmm
    - uh
    - uhm
    - um
    - ah
  # Palabras reales que se cortan solo cuando suenan a muletilla: sueltas,
  # con pausa (o coma) antes y después. "este video" y "me quedo con este" no
  # se tocan.
  muletillas_en_pausa:
    - e                      # Whisper a veces escribe "Eh," como "E."
    - este
    - o sea
    - osea
    - bueno
    - pues
    - digamos
    - tipo
    - como que
  pausa_muletilla: 0.25      # pausa mínima alrededor para tratarla como muletilla
  # Tomas repetidas: si una frase se vuelve a empezar, se queda la última.
  tomas_repetidas: true
  similitud_toma: 0.6

ritmo:
  # Un cambio de plano cada 3 a 5 s: los tramos largos se parten y alternan un
  # zoom suave.
  cambio_cada: [3, 5]
  zooms: [1.0, 1.12]

subtitulos:
  fuente: Montserrat ExtraBold
  archivo_fuente: assets/fuentes/Montserrat-ExtraBold.ttf
  modo: frase                # "palabra" (una a la vez) o "frase" (frases cortas)
  palabras_por_frase: 3
  tamano: 84
  mayusculas: true
  color: "#FFFFFF"
  color_clave: "#FFD400"     # la palabra clave de cada frase
  borde: "#000000"
  grosor_borde: 6
  # Centro-abajo, fuera de la zona de botones de TikTok e Instagram: a la
  # derecha están los botones y abajo la descripción.
  margen_inferior: 560
  margen_izquierdo: 90
  margen_derecho: 190
  # Palabras que siempre van en color si aparecen. Sin tildes, en minúscula.
  palabras_clave: [ia, claude, skills, automatico, automatizar]

cierre:
  texto: Descarga la app
  duracion: 2.5
  tamano: 80
  color: "#FFFFFF"
  fondo: "#000000"
  margen_superior: 250
  # Las reglas de cada app (Bible AI: "Descarga la app", sin tiendas ni precio)
  # están en config/calendario.yaml, sección apps.

musica:
  archivo: null              # ninguna por defecto; libre de derechos si se usa
  volumen_db: -30            # muy baja

audio:
  lufs: -14

transcripcion:
  # faster-whisper corre en el runner de GitHub: sin llave y sin costo.
  proveedor: faster-whisper  # o "openai" (whisper-1, USD 0.006/min, necesita OPENAI_API_KEY)
  modelo: small
  idioma: es
  # Whisper limpia las muletillas si no se le muestran: este texto lo empuja a
  # transcribir literal.
  prompt: "Eh, este... o sea, mmm, bueno. Hola, eh, hoy les voy a contar, este, algo."

sugerencias:
  # El texto generado solo aparece como sugerencia en el resumen de la corrida.
  hashtags: ["#ia", "#tecnologia", "#productividad", "#honduras"]
