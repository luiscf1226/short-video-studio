name: Publicación diaria

# Cada noche toma los videos de `fuente` (config/calendario.yaml):
#   - redes_media: los MP4 ya terminados de luiscf1226/redes-media/videos, tal
#     cual, con su URL raw pública (sin cuenta de servicio);
#   - drive: los nuevos de "Videos del domingo", que edita (cortes, subtítulos,
#     9:16, gancho y cierre) y deja en "Editados".
# Programa SOLO el día siguiente: TikTok, Instagram y LinkedIn en la cola de
# Buffer (plan gratis, máximo 10 programadas por canal) y YouTube Shorts con
# la YouTube Data API (privado con publishAt). Solo sale lo que tiene texto de
# Marca en textos/semana-NN.json.
#
# Nada se publica solo hasta que Luis dé el OK:
#   - a mano (Run workflow) arranca en dry_run; sin dry_run, en borrador;
#   - el cron usa la variable MODO_AUTOMATICO del environment "videos":
#     sin definir es dry_run; "borrador" o "programar" cuando Luis lo diga.
# Todas las llaves salen de los secretos del environment; ninguna vive en el repo.

on:
  schedule:
    # 21:00 en Honduras (UTC-6, sin horario de verano): después del último
    # horario de la cola de Buffer, así lo que entra cae en el día siguiente.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Editar y listar lo que se programaría, sin tocar Buffer, YouTube ni Drive"
        type: boolean
        default: true
      borrador:
        description: "Si no es dry_run: borradores en Buffer y YouTube privado sin fecha (primera prueba)"
        type: boolean
        default: true
      fecha:
        description: "Día a programar, AAAA-MM-DD (vacío: mañana)"
        type: string
        default: ""

# Una corrida a la vez: dos a la vez podrían programar dos veces el mismo día.
concurrency:
  group: publicacion-diaria
  cancel-in-progress: false

permissions:
  contents: write   # solo para guardar estado.json en la rama "estado"

jobs:
  publicar:
    name: Editar y programar
    runs-on: ubuntu-24.04
    environment: videos
    timeout-minutes: 90
    env:
      TZ: America/Tegucigalpa
    steps:
      # Sin credenciales guardadas en .git/config: el token de escritura solo
      # lo ven los dos pasos que leen y guardan la rama estado.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Elegir el modo
        id: modo
        env:
          EVENTO: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          BORRADOR: ${{ inputs.borrador }}
          FECHA: ${{ inputs.fecha }}
          AUTOMATICO: ${{ vars.MODO_AUTOMATICO }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            if [ "$DRY_RUN" = "true" ]; then modo=dry_run
            elif [ "$BORRADOR" = "true" ]; then modo=borrador
            else modo=programar; fi
          else
            case "$AUTOMATICO" in
              borrador|programar) modo="$AUTOMATICO" ;;
              *) modo=dry_run ;;
            esac
          fi
          if [ -n "$FECHA" ] && ! [[ "$FECHA" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::fecha debe ser AAAA-MM-DD"; exit 1
          fi
          echo "modo=$modo" >> "$GITHUB_OUTPUT"
          echo "Modo: $modo"

      - name: Traer el estado (rama estado)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remoto="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # 0: la rama existe. 2: todavía no existe. Cualquier otro código es
          # un error de red o de permisos: mejor fallar que seguir sin estado y
          # volver a programar lo que ya salió.
          codigo=0
          git ls-remote --exit-code --heads "$remoto" estado >/dev/null || codigo=$?
          if [ "$codigo" = 0 ]; then
            git fetch -q --depth=1 "$remoto" estado
            git worktree add --detach estado FETCH_HEAD
          elif [ "$codigo" = 2 ]; then
            echo "La rama estado no existe todavía: se crea al final."
            git worktree add --detach estado HEAD
            git -C estado checkout -q --orphan estado-nuevo
            git -C estado rm -rqf .
          else
            echo "::error::No se pudo leer la rama estado (git ls-remote salió con $codigo)"; exit 1
          fi

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependencias
        run: pip install -q -r requirements.txt

      - name: Modelo de Whisper en caché
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ hashFiles('config/estilo.yaml') }}
          restore-keys: whisper-

      # Solo lecturas (python -m pipeline llaves): comprueba que cada llave
      # sirve sin subir ni programar nada. Así el dry-run también prueba las
      # llaves de YouTube y Buffer, que el paso de edición no recibe en dry_run.
      # Si falla, la corrida sigue (para ver la edición) y al final queda en rojo.
      - name: Probar las llaves (solo lectura)
        id: llaves
        continue-on-error: true
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python -m pipeline llaves

      - name: Editar y programar
        env:
          MODO: ${{ steps.modo.outputs.modo }}
          FECHA: ${{ inputs.fecha }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # En dry_run no se entregan las llaves que escriben.
          GOOGLE_OAUTH_CLIENT_ID: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.GOOGLE_OAUTH_CLIENT_ID || '' }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.GOOGLE_OAUTH_CLIENT_SECRET || '' }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.GOOGLE_OAUTH_REFRESH_TOKEN || '' }}
          BUFFER_API_KEY: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.BUFFER_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.S3_ACCESS_KEY_ID || '' }}
          S3_SECRET_ACCESS_KEY: ${{ steps.modo.outputs.modo != 'dry_run' && secrets.S3_SECRET_ACCESS_KEY || '' }}
        # Con fuente drive, el propio pipeline falla si falta GOOGLE_SERVICE_ACCOUNT_JSON.
        run: |
          args=(correr --modo "$MODO" --estado estado/estado.json)
          if [ -n "$FECHA" ]; then args+=(--fecha "$FECHA"); fi
          python -m pipeline "${args[@]}"

      - name: Resultado de la prueba de llaves
        if: always() && steps.llaves.outcome == 'failure'
        run: |
          echo "::error::Alguna llave no sirve: ver la tabla 'Prueba de llaves' en el resumen de la corrida y docs/guia-llaves.md"
          exit 1

      - name: Guardar el estado
        if: always() && steps.modo.outputs.modo != 'dry_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd estado
          [ -f estado.json ] || exit 0
          git add estado.json
          if git diff --cached --quiet; then echo "Sin cambios de estado"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "estado: corrida ${{ github.run_id }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/estado

      # Los MP4 editados (solo con fuente drive) quedan 7 días para revisarlos.
      - name: Videos editados y resumen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editados-${{ github.run_id }}
          path: |
            build/resumen.md
            build/trabajo/**/*-editado.mp4
            build/trabajo/**/resultado.json
          retention-days: 7
          if-no-files-found: ignore
